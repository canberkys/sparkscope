[project]
name = "gb10-dashboard"
version = "0.2.0"
description = "Live fleet monitoring for mixed Linux hosts and NVIDIA GPUs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncssh>=2.19.0",
    "aiosqlite>=0.21.0",
    "pyyaml>=6.0",
    "websockets>=14.0",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=44",
    "argon2-cffi>=23.1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
