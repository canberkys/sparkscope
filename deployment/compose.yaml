services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sparkscope
      POSTGRES_USER: sparkscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkscope -d sparkscope"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      SPARKSCOPE_DATABASE_URL: postgresql+asyncpg://sparkscope:${POSTGRES_PASSWORD}@db:5432/sparkscope
      SPARKSCOPE_ORIGINS: ${SPARKSCOPE_ORIGINS:-http://127.0.0.1:8010,http://localhost:8010}
      SPARKSCOPE_SECURE_COOKIE: ${SPARKSCOPE_SECURE_COOKIE:-0}
    volumes:
      - data:/data
      - secrets:/var/lib/sparkscope-secrets
volumes:
  database:
  data:
  secrets:
